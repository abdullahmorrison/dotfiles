---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  tasks:
    - name: Get my User
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install Packages
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
          - curl
          - gcc
          - ripgrep
          - zsh
          - zsh-autosuggestions
          - zsh-syntax-highlighting
          - fzf
          - tmux
          - stow
          - gh
          - eza
          - starship
          - neovim
        state: latest
        update_cache: yes
