---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install other packages
      ansible.builtin.apt:
        name:
          - nodejs
          - gcc
          - ripgrep
          - zsh
          - fzf
          - tmux
          - stow
          - gh
          - eza
          - starship
          - neovim
        state: latest
        update_cache: yes
